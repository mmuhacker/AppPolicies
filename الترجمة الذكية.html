#toast {

    bottom: 28px;

    z-index: 100;

        translateY(0); } }

    background: var(--surface3); }

.custom-select-btn .placeholder  {
    color: var(--text3); }

.custom-select-btn .selected-val {
    color: var(--text);
    flex: 1; }

.custom-select-btn .arrow        {
    color: var(--text3);
    flex-shrink: 0;
    transition: transform 0.2s; }

.custom-select-btn.open .arrow   {
    transform: rotate(180deg); }

.dropdown-panel {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    left: 0;
    background: var(--surface2);
    border: 2px solid var(--border2);
    border-radius: var(--radius-sm);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 50;
    overflow: hidden;
  }

.dropdown-panel.open {
    display: block;
    animation: fadeUp 0.15s ease both; }

.dropdown-search-wrap {
    padding: 10px 10px 6px; position: relative; }

.dropdown-search {
    width: 100%;
    background: var(--surface3);
    border: 2px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    padding: 8px 36px 8px 12px;
    outline: none;
    direction: rtl;
    transition: border-color 0.2s;
  }

.dropdown-search:focus {
    border-color: var(--accent2); }

.dropdown-search::placeholder {
    color: var(--text3); }

.dropdown-search-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
    margin-top: 3px; }

.dropdown-list {
    max-height: 240px;
    overflow-y: auto;
    padding: 4px 0 6px; }

.dropdown-item {
    padding: 9px 14px;
    cursor: pointer;
    font-size: 0.92rem;
    color: var(--text2);
    transition: background 0.15s, color 0.15s;
    direction: rtl; }

.dropdown-item:hover {
    background: var(--surface3);
    color: var(--text); }

.dropdown-item.selected {
    color: var(--accent);
    background: rgba(0,201,255,0.07);
    font-weight: 600; }

.dropdown-item.hidden   {
    display: none; }

.dropdown-empty {
    padding: 14px;
    color: var(--text3);
    font-size: 0.88rem;
    text-align: center;
    display: none; }

@media (max-width: 600px) {
    header h1 { font-size: 1.5rem; }

.controls-row {
    flex-direction: column; }

.btn-translate {
    width: 100%;
    justify-content: center; }

.custom-select-wrap {
    min-width: 100%; }

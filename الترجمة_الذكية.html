  * { margin: 0; padding: 0; box-sizing: border-box; }

header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease both;
    position: relative;
    padding: 52px 24px 44px;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    border-top: 4px solid var(--border);
    border-bottom: 5px solid #8a6200;

    background-image: url('https://raw.githubusercontent.com/mmuhacker/MuApp-Assets/refs/heads/main/Translator.jpg');
    background-size: 130%;
    background-position: center;

    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    animation: fadeDown 0.6s ease both, bgPan 22s ease-in-out infinite alternate;

header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, 
      rgba(10, 14, 26, 0.4) 0%, 
      rgba(10, 14, 26, 0.2) 100%);
    z-index: 0;
  }

header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, 
      transparent 50%, 
      rgba(212, 175, 55, 0.20) 45%, 
      rgba(0, 201, 255, 0.30) 55%, 
      transparent 100%);
    background-size: 200% 100%;
    animation: lightSweep 9s linear infinite;
    z-index: 0;
    pointer-events: none;
  }
  
  
header .logo, header h1, header p {
    position: relative;
    z-index: 1;
  }

@keyframes bgPan {
    0%   { background-position: 25% 35%; background-size: 130%; }
    50%  { background-position: 75% 55%; background-size: 140%; }
    100% { background-position: 40% 65%;
        background-size: 130%; }
  }

@keyframes lightSweep {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

.controls-row {

.char-counter {

    not-allowed; }

.chunk-progress {

.result-header {

.btn-copy {

#toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface3); border: 2px solid var(--border2); color: var(--text);
    padding: 12px 22px;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
    backdrop-filter: blur(10px);
  }

#toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0); }

#toast.success {
    border-color: rgba(0,229,160,0.4);
    color: var(--success); }

#toast.error {
    border-color: rgba(255,74,110,0.4);
    color: var(--error); }

@keyframes fadeDown {
    from { opacity: 0;
        transform: translateY(-16px); } to {
        opacity: 1;
        transform:
        translateY(0); } }

@keyframes fadeUp { from {
        opacity: 0;
        transform: translateY(16px);  } to { opacity: 1;
        transform: translateY(0); } }

@keyframes fadeIn { from {
        opacity: 0;
        transform: translateX(-8px);  } to { opacity: 1;
        transform: translateX(0); } }

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
  @keyframes shine {
  0%   { background-position: 0% center; }
  100% { background-position: 200% center; }
}

    box-shadow: 0 0 0 3px rgba(0,132,255,0.1);
    background: var(--surface3); }

.custom-select-btn .placeholder  {
    color: var(--text3); }

.custom-select-btn .selected-val {
    color: var(--text);
    flex: 1; }

.custom-select-btn .arrow        {
    color: var(--text3);
    flex-shrink: 0;
    transition: transform 0.2s; }

.custom-select-btn.open .arrow   {
    transform: rotate(180deg); }

.dropdown-panel {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    left: 0;
    background: var(--surface2);
    border: 2px solid var(--border2);
    border-radius: var(--radius-sm);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 50;
    overflow: hidden;
  }

.dropdown-panel.open {
    display: block;
    animation: fadeUp 0.15s ease both; }

.dropdown-search-wrap {
    padding: 10px 10px 6px; position: relative; }

.dropdown-search {
    width: 100%;
    background: var(--surface3);
    border: 2px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    padding: 8px 36px 8px 12px;
    outline: none;
    direction: rtl;
    transition: border-color 0.2s;
  }

.dropdown-search:focus {
    border-color: var(--accent2); }

.dropdown-search::placeholder {
    color: var(--text3); }

.dropdown-search-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
    margin-top: 3px; }

.dropdown-list {
    max-height: 240px;
    overflow-y: auto;
    padding: 4px 0 6px; }

.dropdown-item {
    padding: 9px 14px;
    cursor: pointer;
    font-size: 0.92rem;
    color: var(--text2);
    transition: background 0.15s, color 0.15s;
    direction: rtl; }

.dropdown-item:hover {
    background: var(--surface3);
    color: var(--text); }

.dropdown-item.selected {
    color: var(--accent);
    background: rgba(0,201,255,0.07);
    font-weight: 600; }

.dropdown-item.hidden   {
    display: none; }

.dropdown-empty {
    padding: 14px;
    color: var(--text3);
    font-size: 0.88rem;
    text-align: center;
    display: none; }

@media (max-width: 600px) {
    header h1 { font-size: 1.5rem; }

.controls-row {
    flex-direction: column; }

.btn-translate {
    width: 100%;
    justify-content: center; }

.custom-select-wrap {
    min-width: 100%; }
